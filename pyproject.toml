[project]
name = "ogd-ai-analyzer"
version = "0.2.0"
description = "Automagically do a deep check of metadata quality of your DCAT OGD offering. "
readme = "README.md"

requires-python = ">=3.10"

dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "openai>=2.29.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]
